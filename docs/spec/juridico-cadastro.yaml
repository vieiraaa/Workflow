# M8 · Jurídico · Cadastro de processos (substitui o fluxo n8n "ATIVOS-DADOS", o Excel e o Power Apps).
# Decisão do usuário em 19/10/2026 (D-033): o LLM continua sendo o MESMO app do Dify que o n8n chama hoje; os PDFs
# entram pelo nosso site; os dados ficam no banco do sistema; o número é validado no CNJ (DataJud); painel com
# resumos como o do Power Apps. Fonte funcional: docs/briefs/agentes-juridicos/HANDOFF_TECHLEAD.md §3.
# FORA deste módulo: Agente de Prazos, ingestão por OneDrive/e-mail, API do Espaider, importar a planilha atual.

modelo:
  Carteira:
    nome:    {tipo: texto, max: 60, unico: true (sem diferenciar maiúsculas)}
    empresa: {tipo: texto, max: 200, regra: "nome da empresa cliente usado quando o cadastro vem só do CNJ"}
    ativa:   {tipo: booleano, padrao: true}
    semente: "Ativos (ATIVOS S.A. SECURITIZADORA DE CRÉDITOS FINANCEIROS), Ailos (COOPERATIVA DE CRÉDITO (SISTEMA AILOS)), Volvo, Toyota, BTB, John Deere"
  ConfigCadastro:   # uma linha só; editada pelo Adm (CAD-14)
    dify_url:         {tipo: url, padrao: "https://eemdevjurdyapi.eem-adv.org/service/api/v1"}
    dify_credencial:  {tipo: texto, regra: "NOME de uma Credencial (bearer) sem setor; o valor nunca é exibido"}
    dify_usuario:     {tipo: texto, padrao: "construtor-espaider"}
    dify_ca_pem:      {tipo: texto, opcional: true, regra: "certificado da CA (PEM) em que confiar SÓ para o host do dify_url (CAD-07a); vazio = cadeia pública padrão"}
    datajud_url:      {tipo: url, padrao: "https://api-publica.datajud.cnj.jus.br"}
    datajud_credencial: {tipo: texto, regra: "NOME de uma Credencial tipo header (header_nome Authorization, valor 'APIKey <chave>')"}
    setores_com_acesso: {tipo: M2M Setor, regra: CAD-02}
  Processo:         # uma linha da antiga aba PROCESSOS
    numero:            {tipo: texto, max: 25, regra: "formatado NNNNNNN-DD.AAAA.J.TR.OOOO quando válido"}
    numero_digitos:    {tipo: texto, max: 20, indice: true, unico_quando_valido: true, regra: CAD-06}
    numero_valido:     {tipo: booleano, regra: "dígito verificador CNJ (módulo 97) confere"}
    status:            {tipo: escolha, valores: [COM_PENDENCIAS, CONFERIR, CADASTRADO], rotulos: ["Com pendências", "Conferir", "Cadastrado no Espaider"]}
    pendencias:        {tipo: lista de texto}
    carteira:          {tipo: FK Carteira, nulo: true}
    empresa / condicao / advogado_empresa: {tipo: texto}
    adverso_nome / adverso_cpf_cnpj / advogado_adverso_nome / advogado_adverso_oab: {tipo: texto}
    tipo_acao / rito / natureza / meio_tramitacao / instancia / desdobramento: {tipo: texto}
    tribunal / comarca / juizo / estado: {tipo: texto}
    fase_atual:        {tipo: escolha, valores: [POSTULATORIA, INSTRUTORIA, DECISORIA, RECURSAL, EXECUCAO_CUMPRIMENTO, ARQUIVADO], nulo: true, regra: CAD-09}
    distribuido_em / data_citacao: {tipo: data, nulo: true}
    valor_causa:       {tipo: "decimal(14,2)", nulo: true}
    pedidos:           {tipo: texto longo}
    assuntos_cnj:      {tipo: texto longo, regra: "assuntos do DataJud (NÃO vão para Pedidos, ponto #10 do handoff)"}
    operacoes_vinculadas: {tipo: texto}
    andamentos:        {tipo: "json lista [{data, evento, fonte: pdf|cnj}]"}
    observacoes:       {tipo: texto longo}
    manuais:           {tipo: texto, regra: "Gerência, Categoria, Escritório, Peticionamento, Na fase desde, Responsável: colunas da planilha que a IA não preenche; campos de texto opcionais, só edição manual"}
    cnj_validacao:     {tipo: escolha, valores: [nao_consultado, confere, divergente, nao_encontrado, falhou], padrao: nao_consultado}
    cnj_divergencias:  {tipo: lista de texto}
    cnj_consultado_em: {tipo: datahora, nulo: true}
    origem_campos:     {tipo: "json objeto campo -> pdf|manual|cnj", regra: CAD-11}
    cadastrado_espaider_em / cadastrado_espaider_por: {nulo: true}
    proxima_audiencia: {tipo: datahora, nulo: true, regra: CAD-20}
    criado_por:        {tipo: FK Usuario, nulo: true, regra: "quem enviou o PDF/número que CRIOU o processo (CAD-06)"}
    criado_via:        {tipo: escolha, valores: [pdf, cnj, manual]}
    excluido_em / excluido_por: {nulo: true, regra: "exclusão lógica (CAD-21); excluído some de todas as listas e contagens"}
    criado_em / atualizado_em / atualizado_por: {auto: true}
  Envio:            # um clique em "Enviar" (= uma linha da antiga aba N8N EXEC)
    origem:        {tipo: escolha, valores: [pdf, cnj]}
    enviado_por:   {tipo: FK Usuario}
    carteira:      {tipo: FK Carteira, nulo: true}
    criado_em / iniciado_em / terminado_em: {}
    contagens:     {regra: "casos, sucessos, com_pendencias, erros: calculadas dos itens"}
  ItemEnvio:        # um PDF ou um número CNJ
    envio:         {tipo: FK Envio, on_delete: CASCADE}
    arquivo:       {tipo: arquivo privado, nulo: true, regra: CAD-04}
    nome_arquivo:  {tipo: texto, max: 255}
    sha256:        {tipo: texto, max: 64, indice: true}
    numero_informado: {tipo: texto, max: 40, regra: "só na origem cnj"}
    status:        {tipo: escolha, valores: [na_fila, processando, concluido, erro, ignorado]}
    tentativas:    {tipo: inteiro, padrao: 0}
    etapa_erro:    {tipo: escolha, valores: ["Leitura do PDF", "IA (Dify)", "CNJ (DataJud)", "Gravação"], nulo: true}
    motivo:        {tipo: texto, max: 500}
    resolvido:     {tipo: booleano, padrao: false, regra: "marcado no Log de erros (CAD-13)"}
    processo:      {tipo: FK Processo, nulo: true, on_delete: SET_NULL}
    acao:          {tipo: escolha, valores: [novo, atualizado], nulo: true}
    duplicado_de:  {tipo: FK ItemEnvio, nulo: true, regra: "item anterior com o mesmo arquivo (CAD-06 a)"}
    resposta_ia:   {tipo: texto, max: 200 KB, regra: "resposta bruta do Dify, mascarada; só o Adm vê (CAD-12)"}
    duracao_ms:    {tipo: inteiro, nulo: true}

permissoes:   # acrescentar em docs/spec/permissoes.yaml
  cadastro.ver:        {adm: todos, coordenador: setor_com_acesso, base: setor_com_acesso}
  cadastro.enviar:     {adm: todos, coordenador: setor_com_acesso, base: setor_com_acesso}
  cadastro.editar:     {adm: todos, coordenador: setor_com_acesso, base: setor_com_acesso}
  cadastro.configurar: {adm: todos, coordenador: nenhum, base: nenhum}
  escopo_setor_com_acesso: >
    O usuário tem acesso se o setor dele está em ConfigCadastro.setores_com_acesso. Com acesso, vê TODOS os processos
    (o cadastro é do escritório, como a planilha), mas o detalhe de um Envio/Item só para quem enviou e o Adm.

regras:
  - id: CAD-01
    texto: >
      Menu lateral ganha o grupo "Jurídico" com "Cadastro de processos" (ícone Lucide `scale`), para quem tem
      cadastro.ver. Rotas em /juridico/: `juridico:painel` (TEL-27), `juridico:processo` (/juridico/processos/<pk>/,
      TEL-28), `juridico:enviar_pdfs` (TEL-29), `juridico:enviar_cnj` (TEL-30), `juridico:envios` (TEL-31),
      `juridico:envio` (/juridico/envios/<pk>/), `juridico:erros` (TEL-32), `juridico:config` (TEL-33, Adm), `juridico:audiencias` (TEL-34),
      `juridico:processo_novo` (TEL-35), `juridico:pdf`, `juridico:status` (JSON do auto-refresh).
  - id: CAD-02
    texto: >
      Sem acesso (setor fora da lista, ou sem setor e não Adm) → 403 em todas as rotas do Jurídico e o menu não aparece.
      Lista vazia de setores = só o Adm usa.
  - id: CAD-03
    texto: >
      Enviar PDFs (TEL-29, POST multipart): campo `arquivos` (múltiplo, até 10 por envio, cada um até 30 MB) e
      `carteira` (opcional). Só aceita arquivo que começa com "%PDF-" (o nome/extensão não basta). Erros (200, nada
      criado): sem arquivo → "Escolha ao menos um PDF."; mais de 10 → "Envie no máximo 10 PDFs por vez."; maior que
      30 MB → "<nome>: maior que 30 MB."; não é PDF → "<nome>: não é um PDF.". Ok → cria Envio + Itens na_fila e
      redireciona para `juridico:envio` com "N PDF(s) na fila. Os dados aparecem no painel em alguns minutos."
  - id: CAD-04
    texto: >
      PDF guardado em disco do servidor (MEDIA_ROOT privado, `juridico/AAAA/MM/<uuid>.pdf`), NUNCA servido por URL
      estática nem gravado no banco; baixar só pela view `juridico:pdf` com cadastro.ver (Content-Disposition attachment,
      nome original saneado). O banco (Supabase) guarda só os dados extraídos.
  - id: CAD-05
    texto: >
      Cadastrar pelo CNJ (TEL-30): `numeros` (textarea; separadores quebra de linha, vírgula ou ponto e vírgula; até 50)
      e `carteira` (obrigatória, lista de Carteira ativas + "Outra / não sei"). Cada número com 20 dígitos vira um item na
      fila; outros → item com erro "Número inválido (o padrão CNJ tem 20 dígitos): <texto>". Vazio → "Informe ao menos um número."
  - id: CAD-06
    texto: >
      Duplicidade (pedido do usuário 19/10: "avise, mostre que já temos, quem fez, com o usuário da pessoa que subiu").
      (a) MESMO ARQUIVO (sha256 igual a item já concluído, de qualquer usuário): detectado NA HORA do envio, antes da
      fila; o item fica `ignorado`, sem chamar o Dify, e a tela do envio mostra em destaque: "Já temos este arquivo:
      processo <número> · enviado por <nome> (<e-mail>) em DD/MM/AAAA HH:MM." com link para o processo. (b) MESMO
      NÚMERO (PDF diferente ou número colado no formulário CNJ de processo que já existe): o processo é atualizado pelas
      regras da CAD-11 e o item mostra "Este processo já existia: cadastrado por <nome> (<e-mail>) em DD/MM/AAAA via
      <PDF|CNJ|manual>. Atualizado: <campos> (ou 'nenhum dado novo')."; no formulário CNJ o aviso aparece já na tela de
      confirmação, por número, antes de enfileirar. O detalhe do processo mostra "Cadastrado por <nome> em <data> via
      <origem>" e o histórico de envios com o usuário de cada um. (c) Número com dígito verificador inválido NUNCA é
      considerado o mesmo de outro: cria Processo novo com a pendência "Número CNJ com dígito verificador inválido:
      confira no PDF.". (d) Processo excluído (CAD-21) com o mesmo número: é restaurado e atualizado, com o aviso
      "Este processo tinha sido excluído por <nome> em <data> e foi restaurado.".
  - id: CAD-07
    texto: >
      Processamento (worker `manage.py processar_cadastros`: laço contínuo; `--uma-vez` processa a fila atual e sai; um item por vez, na ordem de chegada, como o n8n):
      PDF → extrai o texto no servidor (biblioteca pura Python); texto com 200+ caracteres → POST {dify_url}/chat-messages
      com {inputs: {}, query: <texto normalizado>, response_mode: "blocking", user: dify_usuario}; texto acima de 40.000
      caracteres → envia os primeiros 25.000 + "\n[... trecho do meio omitido ...]\n" + os últimos 15.000 (o fim do PDF
      tem citação e decisões recentes; ponto #1). Texto curto ou erro de leitura → POST {dify_url}/files/upload
      (multipart: file, user) e chat-messages com a mesma query do n8n para "PDF ANEXADO" e files [{type: document,
      transfer_method: local_file, upload_file_id}]. Credencial Dify como `Authorization: Bearer`. Prazo 300 s por
      chamada ao Dify; resposta até 2 MB. Mesma proteção SSRF/pin do motor (SEG-01..07), sem caminho de rede novo.
  - id: CAD-07a
    texto: >
      TLS do Dify (achado 19/10: eemdevjurdyapi.eem-adv.org apresenta o certificado padrão de um FortiGate, emitido pela
      CA "FG100FTK23030732", que nenhuma cadeia pública reconhece). A verificação TLS NUNCA é desligada. Se dify_ca_pem
      estiver preenchido, o cliente do Dify confia nessa CA ALÉM da cadeia padrão e só para o host do dify_url (outros
      hosts e o motor de fluxos não mudam). Além disso, o cliente do Dify e do DataJud confia no repositório de certificados do
      SISTEMA OPERACIONAL (biblioteca truststore), para funcionar no notebook Windows da empresa, onde a TI já instala a
      CA do FortiGate; isso vale só para esses dois clientes. PEM inválido → "Certificado inválido: cole o PEM completo (BEGIN/END
      CERTIFICATE)." na Configuração. Falha de TLS → erro "Não foi possível validar o certificado do Dify. Peça à TI um
      certificado válido ou cadastre a CA em Configuração." O ideal é a TI instalar um certificado público no servidor.
  - id: CAD-08
    texto: >
      Leitura da resposta do Dify igual ao nó "Montar linha da planilha": campo `answer`; tira cercas ```; JSON do 1º "{"
      ao último "}"; aceita nomes alternativos de chave; "Não localizado/encontrado/informado/consta" = vazio; datas
      DD/MM/AAAA → data; valor "R$ 1.234,56" → decimal (inválido → vazio + pendência "Valor da causa ilegível: <texto>");
      menos de 3 campos preenchidos → erro "A IA não encontrou dados de processo neste PDF (talvez não seja um processo).";
      JSON inválido → erro "A IA não devolveu os dados no formato esperado." (etapa IA (Dify)). Carteira: a do envio;
      se vazia, deduzida pela empresa (contém o nome da carteira, sem acento/maiúsculas); senão fica vazia + pendência
      "Carteira não identificada.".
  - id: CAD-09
    texto: >
      Fase única (ponto #2): valores do Dify; o caminho CNJ usa as mesmas fases (EXECUÇÃO → EXECUCAO_CUMPRIMENTO;
      SENTENÇA → DECISORIA, provisório até a Controladoria confirmar a lista — D-034).
  - id: CAD-10
    texto: >
      Validação no CNJ (DataJud), depois da extração e no caminho CNJ: só com numero_valido; alias pelo número como no
      nó "Preparar consulta CNJ" (J=8 tj<uf>, 4 trfN, 5 trtN, 6 tre-<uf>; sem alias → cnj_validacao=falhou com
      "Tribunal não suportado no DataJud."). POST {datajud_url}/api_publica_<alias>/_search {query:{match:{numeroProcesso}},size:1},
      prazo 30 s, no máximo 1 consulta a cada 1,5 s. Achou → compara tribunal, distribuído em e comarca (sem acento/caixa;
      comarca: contida no nome do órgão julgador): tudo igual → `confere`; diferente → `divergente` + pendência
      "Divergência com o CNJ: <campo> (PDF: x · CNJ: y)". Não achou → `nao_encontrado` (alerta "Não encontrado no DataJud:
      segredo de justiça ou ainda não indexado.", sem pendência). 401/403 → `falhou` + erro no Log "Chave do DataJud
      recusada: atualize a credencial em Configuração." e aviso no painel para o Adm. Outras falhas → `falhou`, o
      processo é gravado mesmo assim.
  - id: CAD-11
    texto: >
      Mesclagem (regras do n8n): PDF > manual > CNJ. Processo novo → cria. Existente: o PDF substitui todo campo que
      trouxer preenchido e diferente; o CNJ SÓ preenche campo vazio e nunca sobrescreve PDF nem edição manual
      (origem_campos); nunca mexem em status CADASTRADO, observações manuais, campos "manuais" (CAD modelo) nem
      cadastrado_espaider_*. Observações ganha a linha "Atualizado pelo PDF em DD/MM/AAAA HH:MM: <campos>." Andamentos:
      do PDF (até 5) + do CNJ (15 mais recentes), sem repetir (mesma data e texto), ordem decrescente.
  - id: CAD-12
    texto: >
      Status e pendências: obrigatórios Número, Tribunal, Comarca, Juízo, Adverso, Valor da causa, Distribuído em;
      faltando → pendência "Verificar: <campos>"; com qualquer pendência → COM_PENDENCIAS, senão CONFERIR; CADASTRADO
      só pelo botão (CAD-15) e nunca volta sozinho. Recalculado a cada gravação, exceto quando CADASTRADO.
  - id: CAD-13
    texto: >
      Falhas viram item com status erro + etapa + motivo (o "LOG DE ERRO"): leitura do PDF ("Não foi possível abrir o
      PDF nem lê-lo como imagem (corrompido ou com senha)."), Dify fora/timeout ("A IA não respondeu: <motivo curto>."),
      Dify 401/403 ("O Dify recusou a chave: confira a credencial em Configuração."). Dados incompletos também entram no
      Log (etapa "Dados incompletos", motivo "Processo <número> gravado, mas faltou: <campos>"). Item travado em
      processando por mais de 15 min volta para a fila uma vez; na 2ª vez → erro "Processamento interrompido.".
      Botão "Tentar de novo" (POST) num item com erro → volta para a fila (quem enviou ou Adm).
  - id: CAD-14
    texto: >
      Configuração (TEL-33, só Adm): URLs, nomes das credenciais (lista das credenciais sem setor do tipo certo),
      usuário do Dify, setores com acesso, e as carteiras (adicionar, renomear, ativar/desativar). Botão "Testar conexão"
      (POST) chama o Dify com query "ping" e o DataJud com um número de exemplo e mostra "Dify: ok/falhou (<motivo>) ·
      DataJud: ok/falhou" sem expor valores.
  - id: CAD-15
    texto: >
      Detalhe / conferência (TEL-28): cabeçalho com número, chip de status, carteira, "Baixar PDF"; caixa "Validação no
      CNJ" (confere/divergente/não encontrado/falhou com as divergências); lista de pendências; formulário com todos os
      campos em grupos (Identificação, Cliente, Adverso, Jurisdição, Datas e valores, Pedidos, Andamentos, Controle);
      etiqueta da origem de cada campo (PDF/CNJ/manual); "Salvar" (edição vira origem manual, recalcula CAD-12, mensagem
      "Processo salvo."); "Marcar como cadastrado no Espaider" (POST; exige status CONFERIR → senão "Resolva as pendências
      antes de marcar como cadastrado."; grava quem/quando); "Desfazer cadastrado" (Adm); "Consultar CNJ de novo" (POST);
      histórico dos envios que tocaram o processo. Mutação só POST + CSRF → redirect + messages.
  - id: CAD-16
    texto: >
      Painel (TEL-27) no formato do Power Apps (prints LOCAIS, fora do git por terem dados reais: docs/briefs/agentes-juridicos/powerapps/; só a ESTRUTURA vale; a identidade visual é a NOSSA (skill design-base: tokens, light/dark, Inter, Lucide), nunca o roxo/escuro do Power Apps; os dados dos prints nunca): barra superior com
      título "Painel de Processos", botão "Menu" (Enviar PDFs para leitura, Cadastrar pelo nº (CNJ), Cadastro manual de
      processo, Log de erros e desempenho, Envios, Configuração (Adm)), botão de alerta "Audiências (N)" (CAD-20) e
      contadores "N processos · N com pendências · N cadastrados" + "Atualizar". TRÊS colunas no desktop: (1) CLIENTES —
      "Todos" e cada Carteira ativa + "Outros" (sem carteira), com contagem, filtra a lista; (2) PROCESSOS — título
      "Processos · <carteira> (N)", busca ?q= (número só dígitos, adverso, CPF/CNPJ, comarca, empresa), cartões com
      número, adverso + CPF/CNPJ, linha "carteira · comarca · valor", chip de status (CONFERIR / PENDÊNCIAS / CADASTRADO),
      chip de audiência (data e hora) quando houver, ícone do CNJ (confere/divergente) e "Excluir"; paginação 25;
      (3) DETALHES DO PROCESSO — o processo selecionado (?p=<pk>; padrão o 1º da lista) com os botões "Marcar cadastrado
      no Espaider" e "Editar" (abre TEL-28), carteira · tribunal, número, chip, faixa de pendências ("Verificar: …"),
      grupos PARTES (empresa, adverso, condição, advogado empresa, advogado adverso), PROCESSO (tribunal, comarca, juízo,
      instância, rito, distribuído em, data de citação, valor da causa), OPERAÇÕES VINCULADAS, CLASSIFICAÇÃO (natureza,
      categoria, tipo de ação, fase atual, meio de tramitação, gerência, escritório), PEDIDOS, VALIDAÇÃO NO CNJ, CONTROLE
      (processado em, cadastrado por/via, andamentos em lista, responsável, observações). Filtros extras: ?status=,
      ?cnj=, ?ordem= (atualizado padrão, numero, distribuido). Datas sempre DD/MM/AAAA (HH:MM), nunca ISO nem número
      serial do Excel. 390 px: uma coluna (carteiras viram chips roláveis; detalhe abre em página). Queries constantes.
      Vazio: "Nenhum processo cadastrado ainda. Envie os PDFs ou cadastre pelo número." Itens do usuário na fila: a
      página se atualiza sozinha a cada 10 s enquanto houver (sem recarregar tudo).
  - id: CAD-17
    texto: >
      Log de erros e desempenho (TEL-32, como no Power Apps; últimos 30 dias): cartões Última execução (data/hora, origem,
      casos, erros), Execuções (N envios · N casos), Casos com erro (N e % dos casos), Tempo médio por execução (e por
      caso), Erros pendentes (não resolvidos); gráfico "Casos por dia" (barras empilhadas verde ok / vermelho erro, com o
      tempo médio do dia acima da barra); "Erros pendentes por etapa" (barras horizontais: CNJ (DataJud), Dados
      incompletos, Leitura do PDF, Envio do PDF, IA (Dify)); lista "Envios" (mais recentes primeiro: data/hora, origem,
      casos, erros, duração, motivo resumido; borda vermelha se teve erro; clique abre `juridico:envio`); lista "Erros
      pendentes" (data/hora · arquivo ou CNJ, etiqueta da etapa, motivo, botão "Resolvido" (POST)) e alternância
      "Mostrar resolvidos". Envios (TEL-31): a mesma lista completa paginada; detalhe do envio com cada item (status que
      atualiza sozinho, processo gerado ou o aviso de duplicidade CAD-06, motivo do erro e "Tentar de novo").
  - id: CAD-18
    texto: >
      Segurança: chave do Dify e do DataJud só via Credencial (cofre); nunca em log, resposta_ia, tela, mensagem de erro
      ou teste. resposta_ia e motivos passam pelo mascaramento do motor. Texto vindo do PDF/IA é DADO: escapado em tela,
      nunca avaliado. CPF/CNPJ aparece completo só no detalhe (lista mostra mascarado ***.456.789-**). Testes usam
      Dify e DataJud FALSOS em servidor local (SEG-08); nada toca a internet.
  - id: CAD-19
    texto: >
      Contexto das views (contrato Back↔Front, docstring): painel → `resumo` {total, com_pendencias, conferir,
      cadastrados, na_fila, erros}, `ultimos_envios`, `processos` (página), `filtros` {status, carteira, tribunal, cnj, q,
      ordem}, `carteiras`, `aviso_datajud` (só Adm), `atualizar_auto` (bool), `url_status` (JSON das contagens para o
      auto-refresh); processo → `processo`, `form`, `origem_campos`, `pendencias`, `cnj` {situacao, divergencias,
      consultado_em}, `envios`, flags `pode_editar`, `pode_marcar`, `pode_desfazer`; envio → `envio`, `itens`,
      `url_status`; erros → `itens` (página), `filtro_resolvido`; config → form + `carteiras` + `credenciais_bearer`,
      `credenciais_header`, `setores`.

  - id: CAD-20
    texto: >
      Audiências: proxima_audiencia é extraída no servidor (sem IA) das observações e andamentos vindos do PDF/CNJ:
      padrão "audiência ... (designada|marcada|redesignada) para DD/MM/AAAA[,] (às HH:MM | HHhMM)"; vale a data FUTURA
      mais próxima; editável na conferência (vira manual). Botão "Audiências (N)" = processos com audiência de hoje em
      diante (vermelho se alguma nos próximos 7 dias); abre a lista ordenada por data (número, adverso, comarca,
      data/hora, link). Chip de data no cartão do processo.
  - id: CAD-21
    texto: >
      Excluir (POST com confirmação "Excluir o processo <número>? Ele some do painel; o histórico fica guardado.") =
      exclusão lógica, para quem tem cadastro.editar; mensagem "Processo excluído." Adm vê os excluídos em
      Configuração > "Excluídos" e pode restaurar. Cadastro manual (`juridico:processo_novo`): mesmo formulário da
      conferência, número obrigatório e válido (dígito verificador) → senão "Número CNJ inválido."; número que já existe →
      não cria e mostra o aviso da CAD-06 (b) com link; criado_via=manual; consulta o CNJ ao salvar.
  - id: CAD-22
    texto: >
      FORA do M8 (aparecem no menu do Power Apps): "Assistente IA", "Robô Espaider (relatórios)" e "Mais ferramentas
      (duplicados, status)" — a deduplicação da CAD-06 substitui a ferramenta de duplicados.

