# Fonte do scripts/telas.py (capturas light/dark × 1440/390) e da revisão visual.
# Cada tela: rota (nome do urls), kwargs da rota quando houver, papel para logar e estados.
# Estados: o scripts/telas.py prepara cada estado com dados fictícios (fixture por estado,
# definida no próprio script pelo id da tela + estado) antes de capturar.
# Toda tela usa o shell (base.html), exceto as marcadas com shell: false.
telas:
  # --- m0 · Fase 0
  - id: TEL-01
    modulo: m0
    nome: Login
    rota: login
    papel: anonimo
    shell: false
    estados: [padrao, erro_credenciais]
  - id: TEL-10
    modulo: m0
    nome: Sem permissão (403)
    rota: inicio
    papel: sem_papel
    estados: [padrao]
  - id: TEL-11
    modulo: m0
    nome: Não encontrado (404)
    rota: url_inexistente   # o script navega para /nao-existe/
    papel: coordenador
    estados: [padrao]
  # --- m1 · Usuários e papéis
  - id: TEL-02
    modulo: m1
    nome: Usuários (lista)
    rota: contas:usuarios
    papel: adm
    estados: [vazio_busca, com_dados, paginado]   # "vazio" real é impossível (sempre há o Adm): vazio_busca = busca sem resultado
    regras: [USR-01, USR-02, USR-03]
  - id: TEL-03
    modulo: m1
    nome: Usuário (novo)
    rota: contas:usuario_novo
    papel: adm
    estados: [padrao, erro_validacao]
    regras: [USR-04, USR-05]
  - id: TEL-09
    modulo: m1
    nome: Usuário (editar e redefinir senha)
    rota: contas:usuario_editar
    kwargs: {pk: usuario_coordenador}
    papel: adm
    estados: [padrao, erro_validacao]
    regras: [USR-06, USR-07, USR-08]
  - id: TEL-08
    modulo: m1
    nome: Trocar minha senha
    rota: contas:trocar_senha
    papel: base
    estados: [padrao, erro_validacao]
    regras: [USR-10]
  # --- m2 · Fluxos e editor
  - id: TEL-04
    modulo: m2
    nome: Fluxos (lista)
    rota: fluxos:lista
    papel: coordenador
    estados: [vazio, com_dados]
    regras: [FLX-01, FLX-02, FLX-03]
  - id: TEL-12
    modulo: m2
    nome: Fluxos (lista, visão do Usuário base)
    rota: fluxos:lista
    papel: base
    estados: [vazio, com_dados]
    regras: [FLX-05]
  - id: TEL-05
    modulo: m2
    nome: Editor de canvas
    rota: fluxos:editor
    kwargs: {pk: fluxo_demo}
    papel: coordenador
    estados: [vazio, com_3_nos, erro_validacao_no]
    regras: [GRF-01, GRF-03, GRF-05]
  # --- m3 · Execução, histórico e saídas
  - id: TEL-06
    modulo: m3
    nome: Execuções (histórico)
    rota: execucoes:lista
    papel: base
    estados: [vazio, com_dados]
    regras: [EXE-08]
  - id: TEL-07
    modulo: m3
    nome: Execução (detalhe e saídas por nó)
    rota: execucoes:detalhe
    kwargs: {pk: execucao_demo}
    papel: coordenador
    estados: [sucesso, erro_http, bloqueado_ssrf]
    regras: [EXE-07, EXE-09, EXE-15, SEG-09, SEG-10]
  # --- m4 · Home e setores
  - id: TEL-13
    modulo: m4
    nome: Início (Home)
    rota: inicio
    papel: adm
    estados: [vazio, com_dados_7d, com_dados_24h, com_dados_1a]
    regras: [HOM-01, HOM-02, HOM-03, HOM-04, HOM-05, HOM-06, HOM-07]
  - id: TEL-16
    modulo: m4
    nome: Início (visão do gestor)
    rota: inicio
    papel: coordenador
    estados: [com_dados_7d]
    regras: [HOM-01, SET-06]
  - id: TEL-17
    modulo: m4
    nome: Início (visão do usuário base)
    rota: inicio
    papel: base
    estados: [vazio, com_dados_7d]
    regras: [HOM-01, SET-06]
  - id: TEL-14
    modulo: m4
    nome: Setores (lista)
    rota: contas:setores
    papel: adm
    estados: [com_dados]
    regras: [SET-02]
  - id: TEL-15
    modulo: m4
    nome: Setor (formulário)
    rota: contas:setor_novo
    papel: adm
    estados: [padrao, erro_validacao]
    regras: [SET-02]
  # --- m5 · Motor v2
  - id: TEL-18
    modulo: m5
    nome: Credenciais (lista)
    rota: credenciais:lista
    papel: adm
    estados: [vazio, com_dados]
    regras: [CRD-01]
  - id: TEL-19
    modulo: m5
    nome: Credencial (formulário)
    rota: credenciais:nova
    papel: adm
    estados: [padrao, erro_validacao]
    regras: [CRD-01]
  - id: TEL-20
    modulo: m5
    nome: Credencial (editar, valor oculto)
    rota: credenciais:editar
    kwargs: {pk: credencial_demo}
    papel: adm
    estados: [padrao]
    regras: [CRD-01]
  - id: TEL-21
    modulo: m5
    nome: Editor v2
    rota: fluxos:editor
    kwargs: {pk: fluxo_v2_demo}
    papel: adm
    estados: [com_ramos, inspector_http_paginacao, inspector_codigo, relatorio_importacao, pendencias_v2]
    regras: [EDV-01, EDV-02, EDV-03, IMP-02, MV2-14]
  - id: TEL-22
    modulo: m5
    nome: Execução v2 (detalhe com itens e ramos)
    rota: execucoes:detalhe
    kwargs: {pk: execucao_v2_demo}
    papel: adm
    estados: [sucesso_com_ramos, erro_continuar, teste]
    regras: [MV2-07, MV2-12, MV2-14, EXE-15]
  - id: TEL-23
    modulo: m7a
    nome: Funções (catálogo)
    rota: funcoes:catalogo
    papel: adm
    estados: [vazio, com_dados]
    regras: [FUN-01, FUN-02]
  - id: TEL-23
    modulo: m7a
    nome: Funções (catálogo, usuário base)
    rota: funcoes:catalogo
    papel: base
    estados: [vazio, com_dados]
    regras: [FUN-02, FUN-10]
  - id: TEL-24
    modulo: m7a
    nome: Nova função
    rota: funcoes:nova
    papel: adm
    estados: [padrao, erro_validacao]
    regras: [FUN-03, FUN-05]
  - id: TEL-24
    modulo: m7a
    nome: Editar função
    rota: funcoes:editar
    kwargs: {pk: funcao_demo}
    papel: adm
    estados: [padrao]
    regras: [FUN-03, FUN-05]
  - id: TEL-25
    modulo: m7a
    nome: Executar função (entradas)
    rota: funcoes:executar
    kwargs: {pk: funcao_demo}
    papel: adm
    estados: [padrao, erro_campo]
    regras: [FUN-06, FUN-07]
  - id: TEL-26
    modulo: m7a
    nome: Resultado da função
    rota: funcoes:resultado
    kwargs: {pk: execucao_funcao_demo}
    papel: adm
    estados: [sucesso, erro, truncada]
    regras: [FUN-09]
  - id: TEL-27
    modulo: m8
    nome: Cadastro de processos (painel)
    rota: juridico:painel
    papel: adm
    estados: [vazio, com_dados, com_fila]
    regras: [CAD-16, CAD-20]
  - id: TEL-27
    modulo: m8
    nome: Cadastro de processos (painel, usuário base com acesso)
    rota: juridico:painel
    papel: base
    estados: [com_dados]
    regras: [CAD-02, CAD-16]
  - id: TEL-28
    modulo: m8
    nome: Conferência do processo
    rota: juridico:processo
    kwargs: {pk: processo_demo}
    papel: adm
    estados: [conferir, com_pendencias, divergente_cnj, cadastrado]
    regras: [CAD-15]
  - id: TEL-29
    modulo: m8
    nome: Enviar PDFs
    rota: juridico:enviar_pdfs
    papel: base
    estados: [padrao, erro_campo]
    regras: [CAD-03]
  - id: TEL-30
    modulo: m8
    nome: Cadastrar pelo CNJ
    rota: juridico:enviar_cnj
    papel: base
    estados: [padrao, erro_campo]
    regras: [CAD-05]
  - id: TEL-31
    modulo: m8
    nome: Envio (detalhe, com duplicidade)
    rota: juridico:envio
    kwargs: {pk: envio_demo}
    papel: base
    estados: [em_andamento, concluido, duplicado]
    regras: [CAD-06, CAD-17]
  - id: TEL-32
    modulo: m8
    nome: Log de erros e desempenho
    rota: juridico:erros
    papel: adm
    estados: [vazio, com_dados]
    regras: [CAD-17]
  - id: TEL-33
    modulo: m8
    nome: Configuração do cadastro
    rota: juridico:config
    papel: adm
    estados: [padrao, teste_falhou]
    regras: [CAD-07a, CAD-14]
  - id: TEL-34
    modulo: m8
    nome: Audiências
    rota: juridico:audiencias
    papel: adm
    estados: [vazio, com_dados]
    regras: [CAD-20]
  - id: TEL-35
    modulo: m8
    nome: Cadastro manual de processo
    rota: juridico:processo_novo
    papel: adm
    estados: [padrao, erro_campo, duplicado]
    regras: [CAD-21]
