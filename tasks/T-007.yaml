id: T-007
titulo: M1 · Templates das fatias 1-3 (TEL-02, TEL-03, TEL-09, TEL-08)
dono: Vitral (front)
depende_de: [T-002, "aviso do Forja por fatia"]
skills: [design-base, frontend]
objetivo: >
  Templates das telas do M1, cada um assim que o Forja avisar a fatia: lista (tabela em card,
  busca, segmentado de papel, paginação, estado vazio de busca), formulário de novo usuário,
  edição com seção de redefinir senha, trocar minha senha. Erros por campo, toasts, foco visível.
aceite:
  - teste de render (assertTemplateUsed) de cada tela em tests/unit/frontend/
  - checklist alto da design-base sem pendência nas capturas do m1
arquivos: [templates/contas/, templates/componentes/, static/, tests/unit/frontend/]
