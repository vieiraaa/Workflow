id: T-017
titulo: M2 · Editor de canvas (TEL-05) com Drawflow
dono: Vitral (front)
depende_de: [T-002, "contrato FLX-06/GRF-08; aviso do Forja (T-015) para integrar"]
skills: [design-base, frontend]
objetivo: >
  Editor conforme a skill frontend: Drawflow vendorizado (versão + licença → linha para o Lead), paleta com os 3 tipos,
  nó como card (ícone por tipo, título, resumo, badge de erro), inspector lateral com o formulário do nó, toolbar
