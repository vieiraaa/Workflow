  409 com mensagem e recarregar. Pode começar já pelo vendor, CSS e conversor, antes da view do Forja.
aceite:
  - tests/e2e/: smoke Playwright (criar 3 nós, conectar, salvar, recarregar, grafo igual) verde
  - estados vazio, com_3_nos e erro_validacao_no nas capturas, sem pendência alta; usável a 390px (paleta/inspector recolhíveis)
arquivos: [templates/fluxos/, templates/componentes/, static/, tests/unit/frontend/, tests/e2e/]
