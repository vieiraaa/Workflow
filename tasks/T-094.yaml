id: T-094
titulo: Reconciliar o aceite antigo do painel (CAD-16) com o painel v2 (CAD-24/25)
dono: Lupa (qa)
depende_de: [T-092]
regras: [CAD-16 (nota de substituição de 22/10), CAD-24, CAD-25]
aceite:
  - "Depois que a T-092 (HTML do painel v2) estiver commitada: revisar tests/acceptance/juridico/ (ex.: test_cad_painel_audiencias_manual.py) e ajustar SÓ as asserções que a nota da CAD-16 declara substituídas, trocando-as pelas equivalentes da CAD-24/25 — nada de apagar cobertura: cada comportamento continua testado (contagens agora na esteira, clientes 'cadastrados/total', Audiências como filtro, ficha)."
  - "O que continua valendo da CAD-16 segue testado como antes. Relate ao Lead cada asserção trocada (antes → depois)."
  - "Os 5 obsoletos apontados pelo Vitral: test_painel_estrutura_barra_superior_e_contadores, test_tres_colunas_clientes_com_contagem_e_filtro, test_datas_sempre_dd_mm_aaaa_nunca_iso (a regra de data continua: verifique onde há data — lista, ficha, audiência), test_painel_painel_de_detalhes_do_selecionado, test_botao_de_audiencias_fica_vermelho_nos_proximos_7_dias (agora: filtro ?audiencia=1 + lista no Menu)."
  - "test_linha_selecionada_tem_aria_current (painel v2): procurar o aria-current DENTRO da lista de processos, não o primeiro da página — o menu lateral precisa poder ter aria-current='page' (acessibilidade; o Vitral vai restaurá-lo na T-095)."
  - "tests/acceptance/juridico inteiro verde."
arquivos: [tests/acceptance/juridico/]
