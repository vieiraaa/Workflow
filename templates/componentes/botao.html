{# rotulo, variante: primario|secundario|destrutivo|icone, icone, tipo: button|submit, href, bloco, desabilitado, rotulo_acessivel, atributos (texto escapado) #}
{% if href %}<a class="botao botao--{{ variante|default:'secundario' }}{% if bloco %} botao--bloco{% endif %}" href="{{ href }}"{% if rotulo_acessivel %} aria-label="{{ rotulo_acessivel }}"{% endif %}>
{% else %}<button class="botao botao--{{ variante|default:'secundario' }}{% if bloco %} botao--bloco{% endif %}" type="{{ tipo|default:'button' }}"{% if desabilitado %} disabled{% endif %}{% if rotulo_acessivel %} aria-label="{{ rotulo_acessivel }}"{% endif %}{% if modal %} data-modal-abrir="{{ modal }}"{% endif %}>{% endif %}
{% if icone %}{% include "componentes/icone.html" with nome=icone tamanho=16 %}{% endif %}{% if rotulo %}<span>{{ rotulo }}</span>{% endif %}
{% if href %}</a>{% else %}</button>{% endif %}
