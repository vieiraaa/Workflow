{% comment %}id, titulo, texto, confirmar_rotulo, acao_url (POST + CSRF; pode vir de JS via data-form-action), destrutivo. Abre com botão data-modal-abrir=ID. Slots de JS: data-slot titulo, texto, confirmar.{% endcomment %}
<dialog class="modal" id="{{ id }}" aria-labelledby="{{ id }}-titulo"{% if aberto %} data-abrir{% endif %}>
  <form class="modal__corpo" method="post" action="{{ acao_url }}" novalidate>
    {% csrf_token %}
    <h2 id="{{ id }}-titulo" data-slot="titulo">{{ titulo }}</h2>
    <p class="texto-2" data-slot="texto">{{ texto }}</p>
    <div class="modal__acoes">
      <button class="botao botao--secundario" type="button" data-modal-fechar>Cancelar</button>
      <button class="botao botao--{% if destrutivo %}destrutivo{% else %}primario{% endif %}" type="submit" data-slot="confirmar">{{ confirmar_rotulo|default:"Confirmar" }}</button>
    </div>
  </form>
</dialog>
